<!doctype html><html lang="zh"><meta charset="utf-8"><link rel="stylesheet" href="diagram.css">
<style>
  .b { display: inline-block; font-size: 14px; padding: 6px 20px; border-radius: 7px; border: 1.5px solid var(--ink); margin-right: 6px; }
  .b.m { background: var(--ink); color: #fff; }
  .b.s { color: var(--mute); border-color: var(--line); }
  .box p { margin-top: 8px; }
</style>
<h1>两个按钮：一个管走停，一个管跳过</h1>
<!-- 样例 -->
<div class="row">
  <div class="box"><div class="tag">待开始</div><span class="b m">开始</span><span class="b s">跳过</span><p>点「开始」进入进行中。</p></div>
  <div class="harrow">→</div>
  <div class="box"><div class="tag">进行中</div><span class="b m">暂停</span><span class="b s">跳过</span><p>点「暂停」时间停住。</p></div>
  <div class="harrow">⇄</div>
  <div class="box"><div class="tag">已暂停</div><span class="b m">继续</span><span class="b s">跳过</span><p>点「继续」从停住处接着走。</p></div>
</div>
<!-- /样例 -->
<div class="row" style="margin-top: 14px">
  <div class="box key"><b>「跳过」任何时候都能点</b><p>直接切到另一段的待开始：专注 → 休息，休息 → 专注。不弹确认框；跳过的专注不计数，也不响铃。</p></div>
</div>
</html>
