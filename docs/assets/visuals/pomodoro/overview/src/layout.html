<!doctype html><html lang="zh"><meta charset="utf-8"><link rel="stylesheet" href="diagram.css">
<style>
  .browser { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; overflow: visible; }
  .tabs { display: flex; gap: 6px; padding: 8px 10px 0; background: var(--bg); border-radius: 12px 12px 0 0; border-bottom: 1.5px solid var(--line); }
  .tab { font-size: 13px; color: var(--mute); padding: 6px 12px; border: 1.5px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; background: #EDEBE5; white-space: nowrap; }
  .tab.on { color: var(--ink); background: var(--card); font-weight: 600; }
  .page { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 20px 22px; }
  .region { position: relative; }
  .timer { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .stage { font-size: 18px; color: var(--mute); letter-spacing: .2em; }
  .time { font-size: 96px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .status { font-size: 14px; color: var(--brand); }
  .btns { display: flex; gap: 14px; }
  .btn { font-size: 16px; padding: 10px 30px; border-radius: 8px; border: 1.5px solid var(--ink); }
  .btn.main { background: var(--ink); color: #fff; }
  .btn.sub { color: var(--mute); border-color: var(--line); }
  .count { font-size: 15px; }
  .hint { font-size: 12.5px; color: var(--mute); border-top: 1.5px dashed var(--line); padding-top: 10px; margin-top: 8px; }
  .mark { position: absolute; top: -10px; right: -24px; width: 20px; height: 20px; border-radius: 10px; box-shadow: 0 0 0 3px var(--card);
    background: var(--brand); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .tab .mark { position: relative; display: inline-grid; top: -1px; right: auto; margin-left: 8px; box-shadow: none; }
</style>
<h1>番茄钟页面长什么样（示意图，不是截图）</h1>
<!-- 样例 -->
<div class="browser">
  <div class="tabs">
    <span class="tab">收件箱</span><span class="tab">周报草稿</span>
    <span class="tab on region">12:34 · 已暂停<span class="mark">1</span></span>
    <span class="tab">项目看板</span>
  </div>
  <div class="page">
    <div class="region timer"><div class="stage">专注</div><div class="time">12:34</div><span class="mark">2</span></div>
    <div class="status region">已暂停<span class="mark">3</span></div>
    <div class="btns region"><span class="btn main">继续</span><span class="btn sub">跳过</span><span class="mark">4</span></div>
    <div class="count region">今天完成 3 个<span class="mark">5</span></div>
    <div class="hint region">这个浏览器不能保存记录，刷新后今天的完成数会清零<span class="mark">6</span></div>
  </div>
</div>
<!-- /样例 -->
<p class="note">画的是「专注已暂停」时的样子；底部提示只在浏览器不让保存时出现，为了看全也画了出来。尺寸、颜色、字体都还没定，由设计阶段确定，图里的大小关系只表示主次。</p>
</html>
