<!doctype html><html lang="zh"><meta charset="utf-8"><link rel="stylesheet" href="diagram.css">
<style>
  .strip { display: flex; gap: 6px; align-items: flex-end; margin-bottom: 4px; }
  .tab { font-size: 13px; color: var(--mute); padding: 6px 10px; border: 1.5px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; background: #EDEBE5; width: 104px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.on { color: var(--ink); background: var(--card); font-weight: 600; }
  .lbl { font-size: 13px; color: var(--mute); margin: 14px 0 6px; }
  .lbl b { color: var(--ink); }
</style>
<h1>标签页标题：剩余时间放在最前面，标签被挤窄也看得到</h1>
<!-- 样例 -->
<div class="lbl"><b>进行中</b>：标签被挤窄、别的标题被截断时，开头的时间仍露在外面</div>
<div class="strip"><span class="tab">收件箱 - 邮件</span><span class="tab">周报草稿 - 文档</span><span class="tab on">24:59 · 专注</span><span class="tab">项目看板</span><span class="tab">需求评审纪要</span></div>
<div class="lbl"><b>已暂停</b></div>
<div class="strip"><span class="tab">收件箱 - 邮件</span><span class="tab">周报草稿 - 文档</span><span class="tab on">12:34 · 已暂停</span><span class="tab">项目看板</span><span class="tab">需求评审纪要</span></div>
<div class="lbl"><b>到点后</b>：两种文字来回交替，直到你回到页面点一下或按个键</div>
<div class="strip"><span class="tab">收件箱 - 邮件</span><span class="tab">周报草稿 - 文档</span><span class="tab on" style="color: var(--brand); width: auto">专注结束！</span><span class="harrow">⇄</span><span class="tab on" style="width: auto">番茄钟 · 今天 3 个</span></div>
<!-- /样例 -->
<p class="note">待开始时标题是「番茄钟 · 今天 N 个」。不弹系统通知，不要任何权限。</p>
</html>
